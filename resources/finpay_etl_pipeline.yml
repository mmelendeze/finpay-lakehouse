# The main pipeline for Bundle_20260525

resources:
  pipelines:
    finpay_etl_pipeline:
      name: finpay_etl_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "${workspace.file_path}/../src"
      libraries:
        - glob:
            include: ../src/**
      event_log:
        name: event_log
        schema: ${var.schema_event_log}
        catalog: ${var.catalog}
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
